          echo "=== DONE ===" | tee -a verify.txt

      - name: Commit verification results
        run: |
          git config user.email "bot@github-actions"
          git config user.name "GitHub Actions"
          git add verify.txt
          git commit -m "flag verification results [skip ci]" || echo "Nothing to commit"
          git push origin corgi
