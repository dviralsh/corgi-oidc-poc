          echo "=== PHASE 2 TIMINGS ==="
          cat timings_p2.txt

      - name: Commit phase2 timings to repo
        run: |
          git config user.email "bot@github-actions"
          git config user.name "GitHub Actions"
          git add timings.txt timings_p2.txt
          git commit -m "phase2 timing results [skip ci]" || echo "Nothing to commit"
